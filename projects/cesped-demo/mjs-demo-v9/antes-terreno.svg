<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff3ff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b98a5b"/>
      <stop offset="100%" stop-color="#8d623d"/>
    </linearGradient>
    <pattern id="dirtTexture" width="120" height="80" patternUnits="userSpaceOnUse">
      <path d="M10,55 C30,30 55,25 75,45 S115,70 110,40" fill="none" stroke="#7c5434" stroke-width="5" opacity=".45"/>
      <circle cx="28" cy="28" r="8" fill="#a87449" opacity=".55"/>
      <circle cx="90" cy="58" r="10" fill="#a87449" opacity=".45"/>
      <path d="M36,72 l8,-18 l8,12" fill="none" stroke="#6b7d3c" stroke-width="4" opacity=".45"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect y="610" width="1600" height="290" fill="#d8c5ad"/>

  <!-- walls -->
  <polygon points="100,190 420,250 420,680 100,700" fill="#f1f1ec"/>
  <polygon points="1500,190 1180,250 1180,680 1500,700" fill="#efefe9"/>
  <rect x="420" y="250" width="760" height="430" fill="#faf9f5"/>

  <!-- fence lines -->
  <g stroke="#c9c7bf" stroke-width="6" opacity=".8">
    <line x1="420" y1="250" x2="100" y2="190"/>
    <line x1="1180" y1="250" x2="1500" y2="190"/>
    <line x1="420" y1="680" x2="100" y2="700"/>
    <line x1="1180" y1="680" x2="1500" y2="700"/>
  </g>

  <!-- patio border -->
  <polygon points="260,610 800,540 1340,610 1180,680 420,680" fill="#f0ede8"/>

  <!-- dirt terrain -->
  <polygon points="325,575 800,515 1275,575 1125,645 475,645" fill="url(#dirt)" filter="url(#shadow)"/>
  <polygon points="325,575 800,515 1275,575 1125,645 475,645" fill="url(#dirtTexture)" opacity=".8"/>

  <!-- sparse weeds -->
  <g opacity=".75">
    <path d="M520,590 l10,-28 l10,20 l7,-16" fill="none" stroke="#6c8747" stroke-width="5" stroke-linecap="round"/>
    <path d="M705,610 l8,-24 l12,18 l8,-13" fill="none" stroke="#6c8747" stroke-width="5" stroke-linecap="round"/>
    <path d="M930,585 l9,-23 l10,16 l8,-15" fill="none" stroke="#6c8747" stroke-width="5" stroke-linecap="round"/>
    <path d="M1040,610 l9,-26 l10,18 l8,-15" fill="none" stroke="#6c8747" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- stones -->
  <g fill="#b69c84" opacity=".75">
    <ellipse cx="610" cy="620" rx="18" ry="10"/>
    <ellipse cx="960" cy="620" rx="20" ry="11"/>
    <ellipse cx="800" cy="600" rx="15" ry="9"/>
  </g>

  <!-- title block -->
  <rect x="70" y="60" rx="20" ry="20" width="290" height="110" fill="rgba(255,255,255,.85)"/>
  <text x="100" y="108" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#5f5b55">ANTES</text>
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="24" fill="#73695e">Terreno sin césped</text>
</svg>
