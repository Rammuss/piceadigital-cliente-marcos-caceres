server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /data/ { add_header Cache-Control "public, max-age=180, must-revalidate"; }
    location /assets/ { add_header Cache-Control "public, max-age=604800"; }
}
